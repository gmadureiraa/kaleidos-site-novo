<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { margin:0; background:#F4F1EC; font-family:'Inter',system-ui,sans-serif; }
  #card { width:880px; padding:40px 44px 48px; background:#F4F1EC; box-sizing:border-box; }
  h1 { font-size:22px; color:#111; margin:0 0 4px; letter-spacing:-0.01em; }
  p.sub { font-size:13px; color:#6B655B; margin:0 0 22px; }
  .wrap { height:420px; position:relative; }
  .src { font-size:11px; color:#A89F90; margin-top:14px; font-family:'SFMono-Regular',monospace; }
</style></head><body>
<div id="card">
  <h1>"Todo holder" vs. ICP afiado: onde o valor realmente nasce</h1>
  <p class="sub">O ICP núcleo é a interseção de três critérios da a16z — não a baleia de maior ticket. Peso relativo, ilustrativo.</p>
  <div class="wrap"><canvas id="c"></canvas></div>
  <div class="src">Fonte: a16z (critério de ICP núcleo: valor gerado × velocidade de adoção × retenção). Ilustrativo — Kaleidos.</div>
</div>
<script>
const K = { cream:'#F4F1EC', ink:'#111111', pink:'#d262b2', pinkLine:'rgba(210,98,178,1)', pinkSoft:'rgba(210,98,178,0.16)',
  neutral:'#A89F90', neutral3:'#8d877c', grid:'rgba(17,17,17,0.08)',
  sans:"'Inter',system-ui,sans-serif", mono:"'SFMono-Regular',monospace" };
Chart.defaults.font.family = K.sans; Chart.defaults.color = K.ink;
new Chart(document.getElementById('c'), {
  type:'bar',
  data:{
    labels:['Valor gerado','Velocidade de adoção','Retenção pós-incentivo'],
    datasets:[
      { label:'Público difuso ("todo holder")', data:[35,40,20],
        backgroundColor:K.neutral, borderWidth:0, borderRadius:4, barPercentage:0.72, categoryPercentage:0.62 },
      { label:'ICP afiado (dor específica)', data:[88,82,86],
        backgroundColor:K.pink, borderWidth:0, borderRadius:4, barPercentage:0.72, categoryPercentage:0.62 },
    ],
  },
  options:{ responsive:true, maintainAspectRatio:false, animation:false,
    plugins:{ legend:{ labels:{ font:{family:K.sans,size:13}, color:K.ink, boxWidth:14, padding:16 } },
      tooltip:{ callbacks:{ label:(c)=>` ${c.dataset.label}: ${c.parsed.y}` } } },
    scales:{ x:{ grid:{display:false}, ticks:{ color:K.neutral3, font:{family:K.sans,size:12} } },
      y:{ grid:{color:K.grid}, beginAtZero:true, max:100, ticks:{ color:K.neutral3, font:{family:K.mono,size:11} } } } },
});
</script></body></html>
