<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { margin:0; background:#F4F1EC; font-family:'Inter',system-ui,sans-serif; }
  #card { width:880px; padding:40px 44px 48px; background:#F4F1EC; box-sizing:border-box; }
  h1 { font-size:22px; color:#111; margin:0 0 4px; letter-spacing:-0.01em; }
  p.sub { font-size:13px; color:#6B655B; margin:0 0 22px; }
  .wrap { height:430px; position:relative; }
  .src { font-size:11px; color:#A89F90; margin-top:14px; font-family:'SFMono-Regular',monospace; }
</style>
</head>
<body>
<div id="card">
  <h1>SEO vs. GEO: onde o esforço entrega resultado em 2026</h1>
  <p class="sub">Comparação qualitativa por dimensão (0–10) — quanto cada canal pesa hoje</p>
  <div class="wrap"><canvas id="c"></canvas></div>
  <div class="src">Fonte: avaliação qualitativa da Kaleidos (estimativa de mercado). Eixos = peso relativo, não métrica absoluta.</div>
</div>
<script>
const K = { cream:'#F4F1EC', ink:'#111111', pink:'#d262b2', pinkLine:'rgba(210,98,178,1)', pinkSoft:'rgba(210,98,178,0.20)',
  neutral:'#A89F90', neutral3:'#8d877c', grid:'rgba(17,17,17,0.10)', angle:'rgba(17,17,17,0.12)',
  sans:"'Inter',system-ui,sans-serif", mono:"'SFMono-Regular',monospace" };
Chart.defaults.font.family = K.sans; Chart.defaults.color = K.ink;
new Chart(document.getElementById('c'), {
  type:'radar',
  data:{
    labels:['Volume de tráfego','Intenção de compra','Velocidade de resultado','Confiança/autoridade','Custo de entrada','Durabilidade'],
    datasets:[
      { label:'SEO (Google clássico)', data:[9,6,3,7,5,8],
        borderColor:K.neutral3, backgroundColor:'rgba(168,159,144,0.18)', borderWidth:2.5,
        pointBackgroundColor:K.neutral3, pointBorderColor:K.cream, pointRadius:4 },
      { label:'GEO (citação em IA)', data:[5,9,5,9,7,6],
        borderColor:K.pinkLine, backgroundColor:K.pinkSoft, borderWidth:2.5,
        pointBackgroundColor:K.pink, pointBorderColor:K.cream, pointRadius:4 },
    ],
  },
  options:{ responsive:true, maintainAspectRatio:false, animation:false,
    plugins:{ legend:{ labels:{ font:{family:K.sans,size:13}, color:K.ink, boxWidth:14, padding:16 } },
      tooltip:{ callbacks:{ label:(c)=>` ${c.dataset.label}: ${c.parsed.r}/10` } } },
    scales:{ r:{ min:0, max:10,
      grid:{color:K.grid}, angleLines:{color:K.angle},
      pointLabels:{ color:K.ink, font:{family:K.sans,size:12} },
      ticks:{ display:false, stepSize:2, backdropColor:'transparent' } } } },
});
</script>
</body>
</html>
