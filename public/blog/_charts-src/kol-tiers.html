<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { margin:0; background:#F4F1EC; font-family:'Inter',system-ui,sans-serif; }
  #card { width:880px; padding:40px 44px 48px; background:#F4F1EC; box-sizing:border-box; }
  h1 { font-size:22px; color:#111; margin:0 0 4px; letter-spacing:-0.01em; }
  p.sub { font-size:13px; color:#6B655B; margin:0 0 22px; }
  .wrap { height:430px; position:relative; }
  .src { font-size:11px; color:#A89F90; margin-top:14px; font-family:'SFMono-Regular',monospace; }
</style>
</head>
<body>
<div id="card">
  <h1>Custo de um post patrocinado por tier de KOL cripto (US$)</h1>
  <p class="sub">Faixa típica de mercado por nível de influenciador — ponto médio da faixa</p>
  <div class="wrap"><canvas id="c"></canvas></div>
  <div class="src">Fonte: estimativa de mercado da Kaleidos (faixas observadas em 2025–2026). Varia por rede, nicho e formato.</div>
</div>
<script>
const K = { cream:'#F4F1EC', ink:'#111111', pink:'#d262b2', pinkLine:'rgba(210,98,178,1)',
  neutral:'#A89F90', neutral2:'#C9C2B6', neutral3:'#8d877c', grid:'rgba(17,17,17,0.08)',
  sans:"'Inter',system-ui,sans-serif", mono:"'SFMono-Regular',monospace" };
Chart.defaults.font.family = K.sans; Chart.defaults.color = K.ink;
new Chart(document.getElementById('c'), {
  type:'bar',
  data:{
    labels:['Nano\n(1k–10k)','Micro\n(10k–50k)','Mid\n(50k–200k)','Macro\n(200k–500k)','Tier-1\n(500k+)'],
    datasets:[{ label:'Custo médio por post (US$)', data:[125,750,3000,9000,30000],
      backgroundColor:['#C9C2B6','#A89F90','#d262b2','#c14fa0','#a23d83'],
      hoverBackgroundColor:K.pinkLine, borderRadius:6, borderSkipped:false, maxBarThickness:64 }],
  },
  options:{ responsive:true, maintainAspectRatio:false, animation:false,
    plugins:{ legend:{display:false},
      tooltip:{ callbacks:{ label:(c)=>` ~US$ ${c.parsed.y.toLocaleString('en-US')} por post` } } },
    scales:{ x:{ grid:{display:false}, ticks:{ color:K.ink, font:{family:K.sans,size:12} } },
      y:{ grid:{color:K.grid}, beginAtZero:true, type:'logarithmic',
        ticks:{ color:K.neutral3, font:{family:K.mono,size:11}, callback:(v)=>'$'+v.toLocaleString('en-US') } } } },
});
</script>
</body>
</html>
