<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { margin:0; background:#F4F1EC; font-family:'Inter',system-ui,sans-serif; }
  #card { width:880px; padding:40px 44px 48px; background:#F4F1EC; box-sizing:border-box; }
  h1 { font-size:22px; color:#111; margin:0 0 4px; letter-spacing:-0.01em; }
  p.sub { font-size:13px; color:#6B655B; margin:0 0 22px; }
  .wrap { height:420px; position:relative; }
  .src { font-size:11px; color:#A89F90; margin-top:14px; font-family:'SFMono-Regular',monospace; }
</style></head><body>
<div id="card"><h1>Airdrop da Apriori: quatro em cada cinco tokens foram pro Sybil</h1><p class="sub">Distribuição dos tokens reclamados na BNB Chain (novembro 2025) — 80% capturado por 5.800+ carteiras coordenadas</p>
  <div class="wrap"><canvas id="c"></canvas></div><div class="src">Fonte: DL News</div></div>
<script>
const K = { cream:'#F4F1EC', ink:'#111111', pink:'#d262b2', pinkLine:'rgba(210,98,178,1)', pinkSoft:'rgba(210,98,178,0.16)',
  neutral:'#A89F90', neutral3:'#8d877c', grid:'rgba(17,17,17,0.08)',
  sans:"'Inter',system-ui,sans-serif", mono:"'SFMono-Regular',monospace" };
Chart.defaults.font.family = K.sans; Chart.defaults.color = K.ink;
new Chart(document.getElementById('c'), {
  type:'doughnut',
  data:{
    labels:['Carteiras Sybil coordenadas (5.800+)','Restante da distribuição'],
    datasets:[{
      data:[80,20],
      backgroundColor:[K.neutral, K.pink],
      borderColor:K.cream,
      borderWidth:3
    }]
  },
  options:{
    animation:false,
    maintainAspectRatio:false,
    cutout:'58%',
    plugins:{
      legend:{
        position:'bottom',
        labels:{ font:{ family:K.sans, size:13 }, color:K.ink, padding:18, boxWidth:14, boxHeight:14 }
      },
      tooltip:{
        callbacks:{ label:(ctx)=> ' '+ctx.label+': '+ctx.parsed+'%' }
      }
    }
  }
});
</script></body></html>
